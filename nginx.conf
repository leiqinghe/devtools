server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

        client_max_body_size 500m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/image-gen {
        proxy_pass http://devtools-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 320s;
        proxy_send_timeout 320s;
    }

    location /api/tts {
        proxy_pass http://devtools-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 320s;
        proxy_send_timeout 320s;
    }

    # AI 对话机器人（SSE 流式：必须关缓冲，否则流被 nginx 攒包前端收不到）
    location /api/chat {
        proxy_pass http://devtools-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 320s;
        proxy_send_timeout 320s;
    }

    location /api/share {
        proxy_pass http://devtools-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500m;
        proxy_request_buffering off;
    }

    location /share/ {
        proxy_pass http://devtools-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /site.config.json {
        add_header Cache-Control "no-cache";
    }

    # 对话机器人组件与头像（无 hash 文件名，no-cache 保证更新即时生效）
    location ~ ^/chat-(widget\.js|avatar\.png)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;
}
