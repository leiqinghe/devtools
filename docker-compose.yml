services:
  devtools:
    build: .
    container_name: devtools
    restart: always
    ports:
      - "8100:80"
    depends_on:
      devtools-backend:
        condition: service_healthy
    networks:
      - devtools-net

  devtools-backend:
    build: ./server
    container_name: devtools-backend
    restart: always
    environment:
      - IMAGE_GEN_BASE_URL=${IMAGE_GEN_BASE_URL:-}
      - IMAGE_GEN_API_KEY=${IMAGE_GEN_API_KEY:-}
      - IMAGE_GEN_MODEL=${IMAGE_GEN_MODEL:-gpt-image-1}
      - IMAGE_GEN_RATE_LIMIT=${IMAGE_GEN_RATE_LIMIT:-5}
      - IMAGE_GEN_TIMEOUT_MS=${IMAGE_GEN_TIMEOUT_MS:-300000}
      - IMAGE_GEN_ALLOWED_HOSTS=${IMAGE_GEN_ALLOWED_HOSTS:-}
      - TTS_BASE_URL=${TTS_BASE_URL:-https://api.xiaomimimo.com/v1}
      - TTS_API_KEY=${TTS_API_KEY:-}
      - TTS_MODEL=${TTS_MODEL:-mimo-v2.5-tts}
      - TTS_RATE_LIMIT=${TTS_RATE_LIMIT:-5}
      - TTS_TIMEOUT_MS=${TTS_TIMEOUT_MS:-120000}
      - TTS_ALLOWED_HOSTS=${TTS_ALLOWED_HOSTS:-}
      - CHAT_BASE_URL=${CHAT_BASE_URL:-}
      - CHAT_API_KEY=${CHAT_API_KEY:-}
      - CHAT_MODEL=${CHAT_MODEL:-deepseek-v4.1-flash}
      - CHAT_MODELS=${CHAT_MODELS:-deepseek-v4.1-flash}
      - CHAT_RATE_LIMIT=${CHAT_RATE_LIMIT:-10}
      - CHAT_TIMEOUT_MS=${CHAT_TIMEOUT_MS:-120000}
      - CHAT_MAX_TOKENS=${CHAT_MAX_TOKENS:-2000}
      - CHAT_ALLOWED_ORIGINS=${CHAT_ALLOWED_ORIGINS:-}
      - CHAT_ALLOWED_HOSTS=${CHAT_ALLOWED_HOSTS:-}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - devtools-net

networks:
  devtools-net:
